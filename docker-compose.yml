version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: dev-chat-mysql
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - /home/ubuntu/Devchat/.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=devchat
      - MYSQL_USER=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dev-chat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis-stream:
    image: redis:7
    container_name: redis-stream
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "6381:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis-stream/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-stream-data:/data
    networks:
      - dev-chat-network

  dev-chat-frontend:
    image: limkanghyun/dev-chat-frontend:latest
    container_name: dev-chat-frontend
    mem_limit: 64m
    networks:
      - dev-chat-network

  dev-chat-backend-blue:
    image: limkanghyun/dev-chat-backend:latest
    container_name: dev-chat-backend-blue
    mem_limit: 2g
    env_file:
      - /home/ubuntu/Devchat/.env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - RDS_ENDPOINT=${RDS_ENDPOINT}
      - INTERNAL_JWT_SECRET=${INTERNAL_JWT_SECRET}
      - STREAM_REDIS_HOST=redis-stream
      - STREAM_REDIS_PORT=6379
      - JAVA_OPTS=-Xmx1400m -Xms700m
    networks:
      - dev-chat-network
      - redis-sentinel_redis-net
    depends_on:
      mysql:
        condition: service_healthy
      redis-stream:
        condition: service_started

  dev-chat-backend-green:
    image: limkanghyun/dev-chat-backend:latest
    container_name: dev-chat-backend-green
    mem_limit: 2g
    env_file:
      - /home/ubuntu/Devchat/.env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - RDS_ENDPOINT=${RDS_ENDPOINT}
      - INTERNAL_JWT_SECRET=${INTERNAL_JWT_SECRET}
      - STREAM_REDIS_HOST=redis-stream
      - STREAM_REDIS_PORT=6379
      - JAVA_OPTS=-Xmx1400m -Xms700m
    networks:
      - dev-chat-network
      - redis-sentinel_redis-net
    depends_on:
      mysql:
        condition: service_healthy
      redis-stream:
        condition: service_started

  dev-chat-ai:
    image: limkanghyun/dev-chat-ai:latest
    container_name: dev-chat-ai
    restart: unless-stopped
    mem_limit: 1.5g
    env_file:
      - /home/ubuntu/Devchat/.env
    environment:
      - INTERNAL_JWT_SECRET=${INTERNAL_JWT_SECRET}
      # API 서버로 가는 내부 호출 주소. nginx의 내부 전용 포트(8088)를 거쳐 항상 활성 색으로 간다.
      # 호스트 이름에 '_'가 있으면(nginx_proxy) Java URI가 호스트를 못 읽어 "Host is not specified"로 실패하므로
      # 네트워크 별칭 nginx-proxy를 쓴다. .env에 값을 두면 그 값이 우선한다
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://nginx-proxy:8088/internal-api}
      - GEMINI_REVIEW_KEY_1=${GEMINI_REVIEW_KEY_1}
      - GEMINI_REVIEW_KEY_2=${GEMINI_REVIEW_KEY_2}
      - GEMINI_EMBEDDING_KEY_1=${GEMINI_EMBEDDING_KEY_1}
      - GEMINI_EMBEDDING_KEY_2=${GEMINI_EMBEDDING_KEY_2}
      - GEMINI_EMBEDDING_KEY_3=${GEMINI_EMBEDDING_KEY_3}
      - GEMINI_EMBEDDING_KEY_4=${GEMINI_EMBEDDING_KEY_4}
      - GEMINI_EMBEDDING_KEY_5=${GEMINI_EMBEDDING_KEY_5}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - JAVA_OPTS=-Xmx1000m -Xms500m
    networks:
      - dev-chat-network
    depends_on:
      - redis-stream
    # 진행 중인 리뷰(Gemini 응답 최대 60초)가 끝날 시간. 못 끝낸 작업은 재처리 스케줄러가 이어받는다
    stop_grace_period: 120s

  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    mem_limit: 64m
    volumes:
      - ./deployment/nginx_proxy/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - ./www/certbot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - dev-chat-frontend
      - dev-chat-backend-blue
      - dev-chat-backend-green
    # 8088(내부 API 진입점)은 ports에 올리지 않는다. Docker 네트워크 안에서만 쓴다
    networks:
      dev-chat-network:
        # 컨테이너 이름 nginx_proxy는 '_' 때문에 URL 호스트로 쓸 수 없어 별칭을 둔다(deploy.sh는 기존 이름을 그대로 쓴다)
        aliases:
          - nginx-proxy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # 서버의 기존 컨테이너가 쓰던 폴더를 그대로 쓴다. 소유자(65534)는 deploy.sh가 배포마다 맞춘다
      - ./prometheus-data:/prometheus
    networks:
      - dev-chat-network

  grafana:
    # latest로 두면 배포 때 메이저 버전이 저절로 바뀐다. 올릴 때는 버전을 직접 바꾼다
    image: grafana/grafana:13.0.2
    container_name: grafana
    restart: unless-stopped
    mem_limit: 300m
    ports:
      - "3002:3000"
    volumes:
      # 서버의 기존 컨테이너가 쓰던 폴더(grafana.db 포함)를 그대로 쓴다. 소유자(472)는 deploy.sh가 배포마다 맞춘다.
      # 예전에 적어 둔 이름 있는 볼륨은 실제로 쓰인 적이 없다(6월에 만든 컨테이너가 이 폴더를 바인드 마운트해 왔다)
      - ./grafana-data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SERVER_ROOT_URL=https://thedevchat.duckdns.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - GRAFANA_MYSQL_USER=${GRAFANA_MYSQL_USER}
      - GRAFANA_MYSQL_PASSWORD=${GRAFANA_MYSQL_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - dev-chat-network

networks:
  dev-chat-network:
    driver: bridge
    name: dev-chat-network
  redis-sentinel_redis-net:
    external: true

volumes:
  mysql-data:
  redis-stream-data:
