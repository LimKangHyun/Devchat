# Discord 알림 연락처와 알림 정책.
# 웹훅 주소는 서버 .env의 DISCORD_WEBHOOK_URL에서 읽는다. CI 배포 알림(GitHub secret DISCORD_WEBHOOK_URL)과 같은 채널을 쓴다.
# 주의: policies는 Grafana의 기본 알림 정책 전체를 이 내용으로 바꾼다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-devchat
    receivers:
      - uid: discord-devchat
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          use_discord_username: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: discord-devchat
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
