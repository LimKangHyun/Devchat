# Redis Stream 구독 알림 규칙 (지표: devchat-ai StreamSubscriptions).
# 구독이 끊기면 AI 서버는 살아 있고 로그도 조용한데 인덱싱·리뷰 요청을 아무도 읽지 않는다(2026-07~10 장애).
# 그래서 서버 생존(devchat-ai-down)과 따로, 스트림별 구독 상태를 본다.
apiVersion: 1

groups:
  - orgId: 1
    name: devchat-ai-stream
    folder: DevChat
    interval: 1m
    rules:
      - uid: stream-subscription-inactive
        title: Redis Stream 구독 끊김
        condition: C
        for: 5m
        # 지표가 아예 없으면(AI 서버 다운) devchat-ai-down 규칙이 알린다
        noDataState: OK
        execErrState: Error
        labels:
          service: devchat-ai
          severity: critical
        annotations:
          summary: '{{ $$labels.stream }} 구독이 5분 넘게 끊겨 있습니다.'
          description: 이 스트림의 요청(인덱싱·리뷰 등)이 처리되지 않고 쌓입니다. devchat-ai 로그와 /actuator/health/streams를 확인하고, 복구되지 않으면 docker restart dev-chat-ai로 다시 띄우세요. 쌓인 메시지는 docs/runbook/redis-stream-pending.md를 보세요.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-devchat
            model:
              refId: A
              instant: true
              expr: min by (stream) (devchat_stream_subscription_active{job="devchat-ai"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 최대 전달 횟수(기본 3번)를 넘겨 데드레터로 간 요청 (지표: devchat-ai StreamReclaimMetrics, AiReviewPelReclaimScheduler).
      # 데드레터는 다시 처리하지 않으므로, 그 인덱싱·요약·리뷰는 사람이 보고 다시 요청해야 한다.
      - uid: stream-dead-letter
        title: Redis Stream 데드레터 발생
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          service: devchat-ai
          severity: warning
        annotations:
          summary: '{{ $$labels.stream }}에서 15분 안에 데드레터가 생겼습니다.'
          description: 여러 번 다시 처리해도 실패한 요청입니다. devchat-ai 로그에서 "데드레터로 보냄"을 찾고, API 서버의 stream_dead_letter 테이블에 남은 내용을 보세요. 절차는 docs/runbook/redis-stream-pending.md에 있습니다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus-devchat
            model:
              refId: A
              instant: true
              expr: sum by (stream) (increase(devchat_stream_dead_letter_total{job="devchat-ai"}[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
