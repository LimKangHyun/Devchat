# Grafana가 응답하지 않거나 자기 DB를 열지 못하면 Discord로 알린다.
# Grafana 안의 알림 규칙은 Grafana DB가 깨지면 같이 멈추므로(2026-10 장애) 바깥(GitHub Actions)에서 확인한다.
# schedule은 기본 브랜치(prod)에 있을 때만 돈다.
name: Grafana health check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /grafana/api/health
        id: health
        run: |
          URL="https://thedevchat.duckdns.org/grafana/api/health"
          # 잠깐 끊긴 것(재배포 등)으로 알리지 않도록 20초 간격으로 3번까지 확인한다
          for i in 1 2 3; do
            BODY=$(curl -s --max-time 10 -w '\n%{http_code}' "$URL" || true)
            CODE=$(echo "$BODY" | tail -n1)
            DB=$(echo "$BODY" | sed '$d' | jq -r '.database // empty' 2>/dev/null || true)
            echo "try $i: http=$CODE database=$DB"
            if [ "$CODE" = "200" ] && [ "$DB" = "ok" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "detail=HTTP ${CODE:-응답 없음}, database=${DB:-알 수 없음}" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.health.outputs.ok == 'false'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "Grafana 응답 없음"
          description: |
            ${{ steps.health.outputs.detail }}
            https://thedevchat.duckdns.org/grafana/login
            복구될 때까지 30분마다 다시 알립니다. 지난번에는 `docker restart grafana`로 복구됐습니다.
          color: '0xff0000'
          username: "DevChat Bot"
