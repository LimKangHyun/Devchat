spring:
  application:
    name: devchat-ai

  data:
    redis:
      host: redis-stream
      port: 6379
      # 스트림 폴링(XREADGROUP BLOCK 2초)보다 확실히 길어야 한다. 짧으면 폴링마다 시간 초과가 나고 메시지를 잃는다(StreamPollTimeout)
      timeout: 5s
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 500ms

server:
  port: 8081

indexing:
  executor-type: virtual

internal:
  api:
    url: ${INTERNAL_API_URL}
  jwt:
    secret: ${INTERNAL_JWT_SECRET}

gemini:
  review-api-keys: ${GEMINI_REVIEW_KEY_1},${GEMINI_REVIEW_KEY_2}
  embedding-api-keys: ${GEMINI_EMBEDDING_KEY_1},${GEMINI_EMBEDDING_KEY_2},${GEMINI_EMBEDDING_KEY_3},${GEMINI_EMBEDDING_KEY_4},${GEMINI_EMBEDDING_KEY_5}
  embedding:
    document-task-type: RETRIEVAL_DOCUMENT
    query-task-type: CODE_RETRIEVAL_QUERY

qdrant:
  url: ${QDRANT_URL}
  api-key: ${QDRANT_API_KEY}
  collection: devchat

cohere:
  api-key: ${COHERE_API_KEY}