spring:
  application:
    name: devchat-ai

  data:
    redis:
      host: redis-stream
      port: 6379
      timeout: 10000ms
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 500ms

server:
  port: 8081

gemini:
  review-api-keys: ${GEMINI_REVIEW_API_KEYS}
  embedding-api-keys: ${GEMINI_EMBEDDING_API_KEYS}

qdrant:
  url: ${QDRANT_URL}
  api-key: ${QDRANT_API_KEY}
  collection: devchat

cohere:
  api-key: ${COHERE_API_KEY}

# 채팅방별 하루 LLM 토큰 예산 (LlmBudgetService). 80%를 넘으면 맥락 없이 리뷰, 100%를 넘으면 리뷰·요약을 건너뛴다.
llm:
  budget:
    enabled: ${LLM_BUDGET_ENABLED:true}
    daily-tokens-per-room: ${LLM_BUDGET_DAILY_TOKENS_PER_ROOM:500000}
    low-ratio: 0.8
# RAG 대체 처리·검색 시간 지표를 Prometheus로 내보낸다 (RagMetrics).
# 8081은 외부에 노출하지 않고 Docker 내부 네트워크의 Prometheus만 수집한다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # /actuator/health/streams: Redis Stream 구독이 스트림별로 살아 있는지 본다 (RedisStreamSubscriptionsHealthIndicator).
  # Spring Boot는 모든 헬스 지표를 /actuator/health에도 합치므로 거기에도 들어간다.
  # Redis가 잠깐 끊겨도 구독은 유지돼 UP 그대로라, Redis 장애 때문에 이 지표가 DOWN이 되지는 않는다.
  endpoint:
    health:
      group:
        streams:
          include: redisStreamSubscriptions
          show-details: always
  metrics:
    tags:
      application: devchat-ai
