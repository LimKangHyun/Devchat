spring:
  session:
    store-type: none

  # 채팅방 이메일 초대 발송 (Gmail SMTP). 계정이 비어 있으면 메일 대신 로그로 링크를 남긴다.
  # MAIL_PASSWORD는 Gmail "앱 비밀번호"(2단계 인증 필요)다. 계정 비밀번호가 아니다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          github:
            scope:
              - repo
              - admin:repo_hook
              - user
        provider:
          github:
            user-name-attribute: login

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false

file:
  images:
    profile:
      path: images/profile/
      default: default-profile.png
      github: github-profile.png
      ai-reviewer: devchat_code_reviewer.webp
    chat:
      path: images/chat/

github:
  username: GitHubBot
  bot:
    username: Devchat-Code-Assist
  # webhook 서명(X-Hub-Signature-256) 검증용 secret. 비어 있으면 검증하지 않는다(로컬 개발)
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
    # true면 서명 없는 요청을 거절한다. 기존 webhook을 모두 갱신(채팅방 메뉴 "GitHub 연동 갱신")한 뒤 켠다
    require-signature: ${GITHUB_WEBHOOK_REQUIRE_SIGNATURE:false}
# 피드백 보내기 → GitHub 이슈. 서버 .env의 FEEDBACK_GITHUB_TOKEN에 이 레포의 Issues 쓰기 권한만 준
# fine-grained 토큰을 넣는다. 비어 있으면 피드백만 꺼지고 나머지 기능은 그대로 동작한다.
feedback:
  github:
    token: ${FEEDBACK_GITHUB_TOKEN:}
    repository: ${FEEDBACK_GITHUB_REPOSITORY:LimKangHyun/Devchat}
