spring:
  session:
    store-type: none

  # 채팅방 이메일 초대 발송 (Gmail SMTP). 계정이 비어 있으면 메일 대신 로그로 링크를 남긴다.
  # MAIL_PASSWORD는 Gmail "앱 비밀번호"(2단계 인증 필요)다. 계정 비밀번호가 아니다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          github:
            scope:
              - repo
              - admin:repo_hook
              - user
        provider:
          github:
            user-name-attribute: login

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false

file:
  images:
    profile:
      path: images/profile/
      default: default-profile.png
      github: github-profile.png
      ai-reviewer: devchat_code_reviewer.webp
    chat:
      path: images/chat/

github:
  username: GitHubBot
  bot:
    username: Devchat-Code-Assist